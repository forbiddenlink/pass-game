# Gate for PRs and main: install (frozen), typecheck, tests, build.
# Lint is deliberately absent: `pnpm lint` crashes because typescript-eslint
# (latest 8.x, peer typescript <6.1) does not support TypeScript 7. Add it back
# once typescript-eslint ships TS 7 support.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # No `version:` input: pnpm/action-setup reads packageManager from package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      # No Gemini key in CI: the build and any route code run on the offline path.
      - run: pnpm build

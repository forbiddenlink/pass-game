# Accessibility scan via ally (own axe-core a11y tool). Non-blocking/informational.
name: Ally A11y Scan

on:
  schedule:
    - cron: "30 8 * * 1" # Mondays 08:30 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  a11y:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Ally accessibility scan
        continue-on-error: true
        uses: forbiddenlink/ally@f0486ab6b2c8dc7847675a7bd98ee241e84ae148 # main
        with:
          path: "."
          threshold: "9999"
          max-files: "500"
          output: ".ally"
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ally-a11y-report
          path: ".ally/**"
          if-no-files-found: warn
          retention-days: 30
